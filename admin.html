<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TutorSetu Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="adminWrap"><section id="login" class="panel login"><h1>Admin Login</h1><p>Only the TutorSetu owner/admin can access this dashboard.</p><form id="loginForm"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button class="btn primary">Login</button></form><div id="loginMsg"></div></section><section id="dash" class="hidden"><div class="nav"><h1>TutorSetu Admin</h1><button class="btn ghost" onclick="logout()">Logout</button></div><div class="panel"><h2>Add / Edit Tutor</h2><form id="tutorForm" class="adminGrid"><input type="hidden" name="id"><input name="name" placeholder="Tutor name *" required><input name="qualification" placeholder="Qualification"><input name="subjects" placeholder="Subjects"><input name="classes" placeholder="Classes"><input name="experience" placeholder="Experience"><input name="area" placeholder="Area"><input name="fee" type="number" min="0" placeholder="Monthly fee per child"><input name="mode" placeholder="Mode (Home Tuition)"><select name="published"><option value="1">Published</option><option value="0">Unpublished</option></select><div><button class="btn primary">Save Tutor</button> <button type="button" class="btn ghost" onclick="resetTutor()">Clear</button></div></form><form id="photoForm" class="hidden"><input type="file" name="photo" accept="image/jpeg,image/png,image/webp"><button class="btn ghost">Upload Photo</button></form><div id="tutorMsg"></div></div><div class="panel"><h2>Tutors</h2><div id="tutorTable"></div></div><div class="panel"><h2>Parent Requests</h2><div id="requestTable"></div></div></section></main><script src="admin.js"></script></body></html>
